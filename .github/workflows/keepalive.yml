# Supabase free projects pause after a week without traffic.
# This pings the public API every third day so Sindre stays bookable.
name: Hold Sindre våken

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          KEY=$(grep -o "SUPABASE_KEY = '[^']*'" app.js | cut -d"'" -f2)
          curl -fsS "https://xqlcqtruisntqxodjfjx.supabase.co/rest/v1/settings?select=id" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
